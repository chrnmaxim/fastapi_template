# Automatically set to match the number of CPU cores
worker_processes auto;

# Maximum number of open files per worker process
# Formula: worker_connections * worker_processes * 2 (factor of 2 accounts for system file descriptors)
worker_rlimit_nofile 2048;

events {
    # Maximum number of simultaneous connections per worker process
    worker_connections  1024;
}

# MARK: HTTP
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format with timing information
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # Base settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio on;
    server_tokens off; # Hide nginx version for security

    # Client request settings (adjust based on project needs)
    client_max_body_size 10M;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Gzip compression settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024; # Minimum file size to compress
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # SSL certificates (replace <your_domain> with actual domain)
    ssl_certificate    /etc/letsencrypt/live/<your_domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your_domain>/privkey.pem;

    # SSL/TLS security settings
    # For current best practices, see: https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off; # Disable for better security (https://www.imperialviolet.org/2013/06/27/botchingpfs.html)


    # Security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CORS management for API requests
    # Whitelist of allowed origins - checks the Origin header and sets Access-Control-Allow-Origin accordingly
    map $http_origin $cors {
        default '';
        https://strgms.online $http_origin;
        https://www.strgms.online $http_origin;
        https://admin.strgms.online $http_origin;
        https://www.admin.strgms.online $http_origin;
    }

    # Set Access-Control-Allow-Credentials (only when origin is whitelisted)
    map $cors $allow_credentials {
        default '';
        ~.+ 'true';
    }

    # Set Access-Control-Allow-Methods (only when origin is whitelisted)
    map $cors $allow_methods {
        default '';
        ~.+ 'GET, PATCH, POST, PUT, DELETE, OPTIONS';
    }

    # Set Access-Control-Allow-Headers (only when origin is whitelisted)
    map $cors $allow_headers {
        default '';
        ~.+ 'Content-Type, Authorization, X-Requested-With';
    }

    # MARK: Server
    # HTTP server - redirects all requests to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server; # IPv6 support
        server_name <your_domain>;
        return 301 https://$host$request_uri;
    }

    # HTTPS server - main application
    server {
        listen 443 ssl;
        listen [::]:443 ssl; # IPv6 support
        http2 on;
        server_name <your_domain>;

        # Document root for static files
        root /usr/share/nginx/html;
        index index.html;

        # Proxy requests to the backend
        # Docs should be disabled in production
        location ~ ^/(api/v1|docs) {
            # Using Unix socket for optimal performance when nginx and backend are on the same server
            # Set up upstream block if there are multiple backend servers or need keepalive
            proxy_pass http://unix:/var/run/uvicorn.sock;
            proxy_http_version 1.1;

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for actual requests
            add_header Access-Control-Allow-Origin $cors always;
            add_header Access-Control-Allow-Credentials $allow_credentials always;

            # CORS preflight requests (OPTIONS method)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors always;
                add_header Access-Control-Allow-Credentials $allow_credentials always;
                add_header Access-Control-Allow-Methods $allow_methods always;
                add_header Access-Control-Allow-Headers $allow_headers always;
                add_header Access-Control-Max-Age 1728000 always; # Cache preflight for 20 days
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }

        # Static assets with caching, 1 week
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "max-age=604800, public, immutable";
            access_log off; # Disable logging for static assets
            try_files $uri =404;
        }

        # Main location for frontend
        location / {
            try_files $uri $uri/ /index.html;

            # Prevent caching of index.html to ensure users always get the latest version
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }
    }

}