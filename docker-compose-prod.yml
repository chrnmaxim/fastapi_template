services:
  # MARK: Backend
  backend-prod:
    image: backend-prod:latest
    container_name: backend-prod
    restart: always
    command: >
      sh -c "
      uvicorn src.main:app
      --uds /var/run/uvicorn.sock
      --loop uvloop
      --workers $${UVICORN_WORKERS}
      --proxy-headers
      --no-access-log
      "
    env_file: "./.env"
    volumes:
      - uvicorn_socket:/var/run
    networks:
      - prod

  # MARK: Nginx
  nginx-prod:
    container_name: nginx-prod
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uvicorn_socket:/var/run
    networks:
      - prod
    depends_on:
      - backend-prod

volumes:
  uvicorn_socket:

networks:
  prod: